[package]
name = "lari"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
regex = "1.13.1"
rand = { version = "0.10.3", optional = true }

[target.'cfg(target_family="wasm")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "Document", "DomWindowResizeEventDetail", "Element", "Event", "HtmlCanvasElement", "MouseEvent", "WheelEvent", "Window", "console"] }

[dev-dependencies]
rand = "0.10.3"
